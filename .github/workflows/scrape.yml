name: データ更新（スクレイピング）

# 毎日定期実行＋手動実行。ここでのみスクレイピングし、結果CSVをコミットする。
# CSVが更新されると Render が自動で再デプロイし、サイトに反映される。
on:
  # GitHub Actions の cron で毎日確実に起動する（外部cron-job.orgは毎日は起動できて
  # いなかったため。07-17〜20・23〜24が欠落）。
  # GHA cronは混雑時に遅延・稀にスキップするので、1日2回に二重化して「丸一日欠落」を防ぐ
  # （追記型パイプラインなので二重実行は無害。日中公開分も夕方回で拾えて鮮度も上がる）。
  # :00は最も混雑するため:17に分散。
  schedule:
    - cron: "17 21 * * *"   # 毎日 21:17 UTC = 翌 06:17 JST（朝の回）
    - cron: "17 9 * * *"    # 毎日 09:17 UTC =    18:17 JST（夕方の回・スキップ時の保険）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: R2から最新データを取得（スクレイプの土台。取得失敗なら中断）
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ secrets.R2_DATA_BUCKET }}
        run: python scripts/sync_r2.py pull

      - name: データ蓄積（スクレイピング）
        env:
          # R2の鍵はGitHubのSecretsに登録（未登録なら添付保存はスキップされる）
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # データCSVの非公開バケット（R2移行用。Secretsに登録すると build_dataset が
          # R2へアップロードし始める。未登録の間は従来どおりgitのCSVのみ）
          R2_DATA_BUCKET: ${{ secrets.R2_DATA_BUCKET }}
          # Anthropic API（公告テキストのAI要約用。未設定なら生テキストをそのまま格納）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # AI要約は1日1回に抑える（コスト削減）。朝の定期(21:17 UTC)と手動実行のみtrue、
          # 夜の定期(09:17 UTC)はfalse＝スクレイプのみ・AI要約なし。
          RUN_AI_SUMMARY: ${{ (github.event_name != 'schedule' || github.event.schedule == '17 21 * * *') && 'true' || 'false' }}
        run: python scripts/build_dataset.py

      - name: 件数の急減チェック（異常なら以降を中止しR2にもgitにも反映しない）
        run: python scripts/monitor_counts.py

      - name: R2へ保存（件数チェック通過後。ここが本番データの正）
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ secrets.R2_DATA_BUCKET }}
        run: python scripts/sync_r2.py push

      - name: ログをコミット（CSVはR2が正なのでgitには載せない＝.git肥大を止める）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          # tenders.csv は add しない（＝コミットされない）。R2へ保存済みなので不要。
          git add dataset/update_log.json dataset/source_counts.json
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "データ更新ログ $(date -u +%Y-%m-%d)"
            git push
          fi
