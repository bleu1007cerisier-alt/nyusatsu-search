name: データ更新（Playwright電子入札）

# 電子入札SPA/フレームセット系（奈良・神奈川・宮城建設・茨城）をPlaywrightで収集する。
# これらは raw HTTP 不可のため build_dataset.py(scrape.yml) では取得できず、本ワークフローで
# ヘッドレスブラウザを使って別途収集・コミットする。build_dataset は _FETCH_SOURCES 外の
# これら4県の既存行を url マージで保持するため、両ワークフローは競合しない（source別に入替）。
#
# 週2回（月・木）＋手動実行。各スクリプトは冪等（自ソースの行のみ入替）。1つ失敗しても他は継続。
on:
  schedule:
    - cron: "0 21 * * 1,4"   # 月・木 21:00 UTC = 火・金 6:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dataset-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: Playwright インストール
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: R2から最新データを取得（土台。取得失敗なら中断）
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ secrets.R2_DATA_BUCKET }}
        run: python scripts/sync_r2.py pull

      - name: 収集（奈良・神奈川・宮城建設・茨城）
        run: |
          set +e
          for s in scrape_nara_playwright scrape_kanagawa_playwright scrape_miyagi_kensetsu_playwright scrape_ibaraki_playwright; do
            echo "===== $s ====="
            python scripts/$s.py --write
            echo "exit=$? ($s)"
          done
          true

      - name: 件数の急減チェック（異常なら以降を中止しR2にもgitにも反映しない）
        run: python scripts/monitor_counts.py

      - name: R2へ保存（件数チェック通過後。ここが本番データの正）
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ secrets.R2_DATA_BUCKET }}
        run: python scripts/sync_r2.py push

      - name: ログをコミット（CSVはR2が正なのでgitには載せない）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add dataset/source_counts.json
          if git diff --staged --quiet; then
            echo "更新なし（デプロイは日次側のログ更新で起きる）"
          else
            git commit -m "電子入札(Playwright)データ更新 $(date -u +%Y-%m-%d)"
            git push
          fi
