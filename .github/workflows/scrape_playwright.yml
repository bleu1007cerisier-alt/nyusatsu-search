name: データ更新（Playwright電子入札）

# 電子入札SPA/フレームセット系（奈良・神奈川・宮城建設・茨城）をPlaywrightで収集する。
# これらは raw HTTP 不可のため build_dataset.py(scrape.yml) では取得できず、本ワークフローで
# ヘッドレスブラウザを使って別途収集・コミットする。build_dataset は _FETCH_SOURCES 外の
# これら4県の既存行を url マージで保持するため、両ワークフローは競合しない（source別に入替）。
#
# 週2回（月・木）＋手動実行。各スクリプトは冪等（自ソースの行のみ入替）。1つ失敗しても他は継続。
on:
  schedule:
    - cron: "0 21 * * 1,4"   # 月・木 21:00 UTC = 火・金 6:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dataset-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: Playwright インストール
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 収集（奈良・神奈川・宮城建設・茨城）
        run: |
          set +e
          for s in scrape_nara_playwright scrape_kanagawa_playwright scrape_miyagi_kensetsu_playwright scrape_ibaraki_playwright; do
            echo "===== $s ====="
            python scripts/$s.py --write
            echo "exit=$? ($s)"
          done
          true

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add dataset/tenders.csv
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "電子入札(Playwright)自動更新 $(date -u +%Y-%m-%d)"
            git push
          fi
