name: 事業者決定チェック

# 週2回（水・金 17:30 JST = UTC 08:30）＋手動実行
# build_dataset.py（毎朝スクレイピング）とは別ジョブ。
# 目的: 公募結果（事業者決定）の追跡。awardeeが空の案件を定期確認する。
on:
  # GitHub Actions のネイティブ定期実行（週2回・水金 17:30 JST = 08:30 UTC）。
  # ※ cron-job.org 側に本ジョブが未登録で一度も起動していなかったため復活させた。
  schedule:
    - cron: "30 8 * * 3,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: R2から最新データを取得（tenders.csvはR2が正。SQLite化でgitからは除外済み）
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ secrets.R2_DATA_BUCKET }}
        run: python scripts/sync_r2.py pull

      - name: 事業者決定チェック
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_results.py

      - name: R2へ保存（チェックで更新したCSVをR2へ書き戻す＝本番データの正）
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ secrets.R2_DATA_BUCKET }}
        run: python scripts/sync_r2.py push

      - name: ログをコミット（CSVはR2が正なのでgitには載せない）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 再生成ログはコピー退避→HEADに戻す→クリーンpull→退避版で上書き。
          # stash pop 衝突によるコンフリクトマーカー混入を構造的に排除する。
          cp dataset/check_results_log.json "$RUNNER_TEMP/crl.json" 2>/dev/null || true
          git checkout -- dataset/check_results_log.json 2>/dev/null || true
          git pull --rebase origin main
          cp "$RUNNER_TEMP/crl.json" dataset/check_results_log.json 2>/dev/null || true
          git add dataset/check_results_log.json
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "事業者決定チェック $(date -u +%Y-%m-%d)"
            git push
          fi
