<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国AI公募ナビ｜官公庁・自治体の公募・入札情報を一元検索</title>
  <meta name="description" content="官公庁・自治体・独立行政法人の入札・プロポーザル・公募情報を毎日自動収集し、AI要約付きで一元検索。締切間近の案件や決定事業者もまとめて確認できます。">
  <meta property="og:title" content="全国AI公募ナビ｜官公庁・自治体の公募・入札情報を一元検索">
  <meta property="og:description" content="入札・プロポーザル・公募情報を毎日自動収集、AI要約付きで検索できます。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }

    /* カラーパレット: ネイビー基調・アクセントはインディゴ・アンバー */
    :root {
      --c-navy:   #0f172a;
      --c-brand:  #3730a3; /* インディゴ700 */
      --c-accent: #f59e0b; /* アンバー */
      --c-text:   #1e293b;
      --c-muted:  #64748b;
      --c-bg:     #f8fafc;
      --c-card:   #ffffff;
    }

    /* ヘッダー */
    .gradient-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
    }

    /* カード */
    .card-hover { transition: box-shadow .18s ease, border-color .18s ease, transform .12s ease; }
    .card-hover:hover {
      box-shadow: 0 6px 24px rgba(55,48,163,.10);
      border-color: #a5b4fc;
      transform: translateY(-2px);
    }

    /* 種別バッジ: 2色に絞る */
    .badge-nyusatsu { background:#ede9fe; color:#4338ca; }  /* 入札: インディゴ */
    .badge-proposal { background:#ede9fe; color:#4338ca; }  /* プロポーザル: 同系 */
    .badge-rfi      { background:#fef3c7; color:#b45309; }  /* RFI: アンバー */
    .badge-zuii     { background:#f1f5f9; color:#475569; }  /* 随意: スレート */

    /* AI要約ブロック */
    .summary-block {
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      border-left: 3px solid #818cf8;
    }
    .summary-text { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .summary-bullets { list-style: none; padding: 0; margin: 0; }
    .summary-bullets li { font-size: 0.78rem; color: #374151; line-height: 1.6; padding: 1px 0; }
    .summary-bullets li::before { content: ""; }

    /* フィルタパネル */
    @media (max-width: 640px) {
      #filter-panel { display: none; }
      #filter-panel.open { display: flex; }
    }

    /* 状態ボタン active */
    .status-btn-active { background: #3730a3; color: #fff; border-color: #3730a3; }
    .status-btn { background: #fff; color: #334155; border-color: #e2e8f0; }
    .status-btn:hover { background: #f8fafc; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- ヘッダー -->
  <header class="gradient-header text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between">
      <div>
        <a href="/" class="block">
          <div class="flex items-center gap-2">
            <span class="text-2xl">🧭</span>
            <div>
              <h1 class="text-2xl font-bold tracking-tight leading-none">全国AI公募ナビ</h1>
              <p class="text-blue-200 text-xs mt-0.5 tracking-wide">KOUBO NAVI</p>
            </div>
          </div>
          <p class="text-blue-200 text-xs mt-1.5">官公庁・自治体の公募・入札情報を全国網羅・AI でナビゲート</p>
        </a>
      </div>
      <div class="flex items-center gap-4">
        <div id="stats-badge" class="text-right text-sm text-blue-100 hidden sm:block"></div>
        <a href="/dev" class="text-xs text-blue-200 hover:text-white border border-blue-400 hover:border-white rounded-lg px-3 py-1.5 transition-colors">🛠️ 開発者</a>
      </div>
    </div>
  </header>

  <!-- 検索エリア -->
  <div class="bg-white border-b shadow-sm sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3">

      <!-- キーワード + 検索ボタン (常時表示) -->
      <div class="flex gap-2">
        <input id="q" type="text" placeholder="キーワードで検索（例：システム開発、脱炭素、委託）"
          class="flex-1 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50"
          onkeydown="if(event.key==='Enter') search()">
        <button onclick="search()"
          class="bg-indigo-700 hover:bg-indigo-800 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shrink-0">
          🔍 検索
        </button>
        <!-- スマホ: 絞り込みトグル -->
        <button onclick="toggleFilter()"
          class="sm:hidden border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 px-3 py-2.5 rounded-xl text-sm transition shrink-0">
          ⚙️
        </button>
      </div>

      <!-- フィルターパネル (PC: 常時, スマホ: トグル) -->
      <div id="filter-panel" class="flex flex-wrap gap-2 mt-2.5">
        <!-- 種別 -->
        <select id="category" onchange="search(0)" class="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">すべての種別</option>
          <option value="入札">入札</option>
          <option value="プロポーザル">プロポーザル</option>
          <option value="RFI">RFI</option>
          <option value="随意契約">随意契約</option>
        </select>

        <!-- 都道府県 -->
        <select id="prefecture" onchange="search(0)" class="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">すべての地域</option>
          <option value="国">国（省庁）</option>
          <option value="北海道">北海道</option><option value="青森県">青森県</option>
          <option value="岩手県">岩手県</option><option value="宮城県">宮城県</option>
          <option value="秋田県">秋田県</option><option value="山形県">山形県</option>
          <option value="福島県">福島県</option><option value="茨城県">茨城県</option>
          <option value="栃木県">栃木県</option><option value="群馬県">群馬県</option>
          <option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option>
          <option value="東京都">東京都</option><option value="神奈川県">神奈川県</option>
          <option value="新潟県">新潟県</option><option value="富山県">富山県</option>
          <option value="石川県">石川県</option><option value="福井県">福井県</option>
          <option value="山梨県">山梨県</option><option value="長野県">長野県</option>
          <option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option>
          <option value="愛知県">愛知県</option><option value="三重県">三重県</option>
          <option value="滋賀県">滋賀県</option><option value="京都府">京都府</option>
          <option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option>
          <option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option>
          <option value="鳥取県">鳥取県</option><option value="島根県">島根県</option>
          <option value="岡山県">岡山県</option><option value="広島県">広島県</option>
          <option value="山口県">山口県</option><option value="徳島県">徳島県</option>
          <option value="香川県">香川県</option><option value="愛媛県">愛媛県</option>
          <option value="高知県">高知県</option><option value="福岡県">福岡県</option>
          <option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option>
          <option value="熊本県">熊本県</option><option value="大分県">大分県</option>
          <option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option>
          <option value="沖縄県">沖縄県</option>
        </select>

        <!-- 発注機関 -->
        <select id="ministry" onchange="search(0)" class="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">すべての機関</option>
        </select>

        <!-- 参照サイト（データソース） -->
        <select id="source" onchange="search(0)" class="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">すべての参照サイト</option>
        </select>

        <!-- 並び替え -->
        <select id="sort" onchange="search(0)" class="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">おすすめ順（募集中→新着）</option>
          <option value="deadline">締切が近い順</option>
          <option value="new">新着順</option>
        </select>

        <!-- 期間（詳細検索）トグル -->
        <button onclick="toggleAdvPanel()" id="adv-btn"
          class="border border-slate-200 hover:bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm transition">
          📅 期間 <span id="adv-arrow">▾</span>
        </button>

        <!-- リセット -->
        <button onclick="reset()"
          class="border border-slate-200 hover:bg-slate-100 text-slate-500 px-4 py-2 rounded-lg text-sm transition">
          リセット
        </button>
      </div>

      <!-- 詳細検索: 期間指定 -->
      <div id="adv-panel" class="hidden mt-2.5 flex flex-wrap gap-x-5 gap-y-2 items-center text-sm bg-slate-50 border border-slate-100 rounded-lg px-3 py-2">
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-slate-500">締切日</span>
          <input type="date" id="deadline-from" onchange="search(0)" class="border border-slate-200 rounded px-2 py-1 text-xs bg-white">
          <span class="text-slate-400">〜</span>
          <input type="date" id="deadline-to" onchange="search(0)" class="border border-slate-200 rounded px-2 py-1 text-xs bg-white">
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-slate-500">掲載日</span>
          <input type="date" id="published-from" onchange="search(0)" class="border border-slate-200 rounded px-2 py-1 text-xs bg-white">
          <span class="text-slate-400">〜</span>
          <input type="date" id="published-to" onchange="search(0)" class="border border-slate-200 rounded px-2 py-1 text-xs bg-white">
        </div>
        <button onclick="clearDates()" class="text-xs text-slate-400 hover:text-slate-600 underline">期間クリア</button>
      </div>

      <!-- タグ検索（本サイトの核）: ヘッダー内に常設 -->
      <div class="mt-2.5">
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="toggleTagPanel()" id="tag-panel-btn"
            class="text-sm px-3 py-1.5 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition font-medium">
            🏷️ タグで探す <span id="tag-panel-arrow">▾</span>
          </button>
          <div id="selected-tags" class="flex flex-wrap gap-1.5 items-center"></div>
          <div id="tag-mode-wrap" class="hidden items-center gap-1 text-xs">
            <button id="mode-or" onclick="setTagMode('or')"
              class="px-2 py-1 rounded-l-lg border text-xs"></button>
            <button id="mode-and" onclick="setTagMode('and')"
              class="px-2 py-1 rounded-r-lg border -ml-1 text-xs"></button>
          </div>
          <button id="tag-clear" onclick="clearTags()"
            class="hidden text-xs text-slate-400 hover:text-slate-600 underline">全解除</button>
        </div>

        <!-- タグピッカー本体 -->
        <div id="tag-panel" class="hidden mt-2 border-t border-slate-100 pt-2">
          <input id="tag-filter" type="text" placeholder="タグ名で絞り込み（例: 風力、漁業、DX）"
            oninput="renderTagPanel()"
            class="w-full sm:w-80 border border-slate-200 rounded-lg px-3 py-1.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-300 mb-2">
          <div id="tag-categories" class="max-h-72 overflow-y-auto space-y-1 pr-1"></div>
          <p class="text-xs text-slate-400 mt-1.5 pb-1">数字は登録案件数（<span class="text-emerald-600">緑</span>は募集中）。複数選ぶとOR/ANDを切り替えられます。選ぶたびに結果は即更新されます。</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 状態フィルタ -->
  <div class="max-w-6xl mx-auto px-4 pt-4 space-y-2">
    <div id="status-bar" class="flex flex-wrap gap-2"></div>
  </div>

  <!-- 結果エリア -->
  <main class="max-w-6xl mx-auto px-4 py-5">
    <div id="result-summary" class="text-sm text-slate-400 mb-3"></div>
    <div id="results" class="space-y-3"></div>
    <div id="loading" class="hidden text-center py-14 text-slate-400">
      <div class="inline-block w-6 h-6 border-2 border-blue-400 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p>読み込み中...</p>
    </div>
    <div id="no-results" class="hidden text-center py-14 text-slate-400">
      <p class="text-4xl mb-3">📭</p>
      <p>該当する案件が見つかりませんでした</p>
    </div>

    <!-- ページネーション -->
    <div id="pagination" class="flex justify-center gap-1.5 mt-8"></div>

    <!-- 注意書き -->
    <p class="mt-10 text-xs text-slate-400 leading-relaxed border-t border-slate-100 pt-4">
      ⚠️ 本サイトの情報は各機関の公開情報を自動収集・整形したものです。誤りや古い情報、リンク切れが含まれる場合があります。
      応募・正確な内容の確認は必ず各案件の掲載元（公式ページ）をご確認ください。
    </p>

    <div id="dev-link-wrap" class="hidden mt-4 text-right">
      <a href="/dev" class="text-xs text-slate-300 hover:text-slate-500">🛠️ 開発者ステータス</a>
    </div>
  </main>

  <script>
    let currentPage = 0;
    let selectedTags = [];    // 選択中タグ（複数）
    let tagMode = 'or';       // 複数タグの結合: or / and
    let TAG_DATA = null;      // /api/tags のキャッシュ
    let currentStatus = '';
    let currentDue = 0;       // 締切間近フィルタ（0=なし、7=7日以内）
    let pendingMinistry = ''; // URL復元用（機関プルダウンは非同期で埋まるため）
    const PAGE_SIZE = 20;

    function esc(s) {
      return (s == null ? '' : String(s))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function toggleFilter() {
      const p = document.getElementById('filter-panel');
      p.classList.toggle('open');
    }

    function toggleAdvPanel() {
      const p = document.getElementById('adv-panel');
      const arrow = document.getElementById('adv-arrow');
      const opening = p.classList.contains('hidden');
      p.classList.toggle('hidden');
      arrow.textContent = opening ? '▴' : '▾';
    }

    function clearDates() {
      ['deadline-from', 'deadline-to', 'published-from', 'published-to']
        .forEach(id => document.getElementById(id).value = '');
      search(0);
    }

    // 詳細ページへ移動（戻ったときに位置を復元できるようスクロール位置を保存）
    function goDetail(id) {
      try {
        sessionStorage.setItem('backScroll',
          JSON.stringify({ qs: location.search, y: window.scrollY }));
      } catch (e) {}
      location.href = '/tender/' + id;
    }

    const SOURCE_LABEL = { 'PORTAL': '調達ポータル', 'NEDO': 'NEDO', 'JST': 'JST', 'JOGMEC': 'JOGMEC', 'AICHI': '愛知県', 'TOKYO': '東京都', 'OSAKA': '大阪府', 'FUKUOKA': '福岡県', 'MIE': '三重県', 'GIFU': '岐阜県', 'YAMANASHI': '山梨県', 'TOYAMA': '富山県', 'NAGANO': '長野県', 'SHIZUOKA': '静岡県', 'FUKUI': '福井県', 'NIIGATA': '新潟県', 'ISHIKAWA': '石川県', 'TOCHIGI': '栃木県', 'CHIBA': '千葉県', 'KYOTO': '京都府', 'HYOGO': '兵庫県', 'SHIGA': '滋賀県', 'WAKAYAMA': '和歌山県', 'HIROSHIMA': '広島県', 'OKAYAMA': '岡山県', 'EHIME': '愛媛県', 'KOCHI': '高知県', 'SAGA': '佐賀県', 'MIYAZAKI': '宮崎県', 'SHIMANE': '島根県', 'KUMAMOTO': '熊本県', 'HOKKAIDO': '北海道', 'TOKUSHIMA': '徳島県', 'NAGASAKI': '長崎県', 'OKINAWA': '沖縄県', 'OITA': '大分県', 'AKITA': '秋田県' };
    function srcLabel(s) { return SOURCE_LABEL[s] || s || ''; }

    const SOURCE_COLOR = {
      'NEDO':   'bg-amber-50 text-amber-700 border-amber-200',
      'JST':    'bg-indigo-50 text-indigo-600 border-indigo-100',
      'JOGMEC': 'bg-amber-50 text-amber-700 border-amber-200',
      'PORTAL': 'bg-slate-50 text-slate-500 border-slate-200',
    };

    const STATUS_STYLE = {
      '募集中':   { cls: 'bg-emerald-50 text-emerald-700 border border-emerald-200', icon: '●' },
      '公開中':   { cls: 'bg-amber-50 text-amber-700 border border-amber-200',       icon: '◑' },
      '公開終了': { cls: 'bg-slate-100 text-slate-400 border border-slate-200',      icon: '○' },
    };
    function statusBadge(status) {
      const s = STATUS_STYLE[status] || { cls: 'bg-slate-100 text-slate-500', icon: '' };
      return `<span class="text-xs font-medium px-2 py-0.5 rounded-full ${s.cls} whitespace-nowrap">${s.icon} ${esc(status)}</span>`;
    }

    function deadlineStatus(deadline) {
      if (!deadline) return { label: '締切: 未定', cls: 'text-slate-400', badge: '' };
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const d = new Date(deadline + 'T00:00:00');
      const days = Math.round((d - today) / 86400000);
      if (days < 0) return { label: `締切: ${deadline}`, cls: 'text-slate-400', badge: '' };
      if (days === 0) return { label: `締切: ${deadline}`, cls: 'text-red-600 font-semibold', badge: `<span class="text-xs px-1.5 py-0.5 rounded-full bg-red-100 text-red-700 ml-1 font-bold">今日！</span>` };
      if (days <= 7) return { label: `締切: ${deadline}`, cls: 'text-red-600 font-semibold', badge: `<span class="text-xs px-1.5 py-0.5 rounded-full bg-red-100 text-red-700 ml-1">あと${days}日</span>` };
      if (days <= 14) return { label: `締切: ${deadline}`, cls: 'text-amber-600', badge: `<span class="text-xs px-1.5 py-0.5 rounded-full bg-amber-50 text-amber-600 ml-1">あと${days}日</span>` };
      return { label: `締切: ${deadline}`, cls: 'text-slate-600', badge: '' };
    }

    async function loadStats() {
      const res = await fetch('/api/stats');
      const data = await res.json();

      document.getElementById('stats-badge').innerHTML =
        `<div class="font-semibold">${data.total.toLocaleString()} 件</div>
         <div class="text-xs text-blue-200 mt-0.5">入札 ${data.nyusatsu} ／ プロポーザル ${data.proposal}</div>`;
      document.getElementById('stats-badge').classList.remove('hidden');

      // 状態フィルタ
      const sc = data.status || {};
      const statusBar = document.getElementById('status-bar');
      const btn = (label, count) => {
        const active = currentStatus === label;
        const base = label === '' ? 'すべて' : `${(STATUS_STYLE[label]||{}).icon||''} ${label}`;
        const cnt = label === '' ? data.total : (count || 0);
        return `<button onclick="filterByStatus('${label}')"
          class="text-sm px-3 py-1.5 rounded-lg border transition font-medium ${active ? 'status-btn-active shadow-sm' : 'status-btn'}">
          ${base} <span class="${active ? 'opacity-70' : 'text-slate-400'} text-xs font-normal">${cnt.toLocaleString()}</span></button>`;
      };
      const dueActive = currentDue > 0;
      const dueBtn = `<button onclick="filterByDue()"
        class="text-sm px-3 py-1.5 rounded-lg border transition font-medium ${dueActive ? 'bg-red-600 text-white border-red-600 shadow-sm' : 'bg-white text-red-600 border-red-200 hover:bg-red-50'}">
        ⏰ 締切7日以内</button>`;
      statusBar.innerHTML =
        `<span class="text-xs text-slate-400 self-center mr-1">状態:</span>` +
        btn('', data.total) + btn('募集中', sc['募集中']) + btn('公開中', sc['公開中']) + btn('公開終了', sc['公開終了']) + dueBtn;

      // 発注機関プルダウン
      const msel = document.getElementById('ministry');
      if (msel && !msel.dataset.filled && (data.organizations || []).length) {
        const cur = msel.value;
        msel.innerHTML = '<option value="">すべての機関</option>' +
          data.organizations.map(o =>
            `<option value="${esc(o.name)}">${esc(o.name)}（${o.count}）</option>`).join('');
        msel.value = cur;
        msel.dataset.filled = '1';
        if (pendingMinistry) { msel.value = pendingMinistry; pendingMinistry = ''; }
      }

      // 参照サイト（データソース）プルダウン
      const ssel = document.getElementById('source');
      if (ssel && !ssel.dataset.filled && (data.sources || []).length) {
        const cur = ssel.value;
        ssel.innerHTML = '<option value="">すべての参照サイト</option>' +
          data.sources.map(code =>
            `<option value="${esc(code)}">${esc(srcLabel(code))}</option>`).join('');
        ssel.value = cur;
        ssel.dataset.filled = '1';
      }

      const devWrap = document.getElementById('dev-link-wrap');
      if (devWrap && data.dev_link_visible) devWrap.classList.remove('hidden');
    }

    function filterByStatus(status) {
      currentStatus = (currentStatus === status) ? '' : status;
      loadStats();
      search(0);
    }

    function filterByDue() {
      currentDue = currentDue ? 0 : 7;
      if (currentDue) currentStatus = '';  // 状態フィルタと排他（締切間近=募集中のみ）
      loadStats();
      search(0);
    }

    // ── タグ検索（核機能） ────────────────────────────
    async function loadTags() {
      if (TAG_DATA) return TAG_DATA;
      const res = await fetch('/api/tags');
      TAG_DATA = await res.json();
      return TAG_DATA;
    }

    function toggleTagPanel() {
      const p = document.getElementById('tag-panel');
      const arrow = document.getElementById('tag-panel-arrow');
      const opening = p.classList.contains('hidden');
      p.classList.toggle('hidden');
      arrow.textContent = opening ? '▴' : '▾';
      if (opening) loadTags().then(() => renderTagPanel());
    }

    function renderTagPanel() {
      if (!TAG_DATA) return;
      const filter = (document.getElementById('tag-filter').value || '').trim().toLowerCase();
      const box = document.getElementById('tag-categories');
      box.innerHTML = TAG_DATA.categories.map(cat => {
        const tags = cat.tags.filter(t =>
          !filter || t.name.toLowerCase().includes(filter));
        if (!tags.length) return '';
        const hasSelected = tags.some(t => selectedTags.includes(t.name));
        const open = filter || hasSelected ? ' open' : '';
        return `<details class="border border-slate-100 rounded-lg"${open}>
          <summary class="cursor-pointer select-none px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg">
            ${esc(cat.category)} <span class="text-xs text-slate-400 font-normal">${tags.length}タグ</span></summary>
          <div class="px-3 pb-2.5 flex flex-wrap gap-1.5">${tags.map(t => {
            const sel = selectedTags.includes(t.name);
            const dim = !t.count && !sel ? ' opacity-40' : '';
            return `<button onclick="toggleTag('${esc(t.name)}')"
              class="text-xs px-2 py-1 rounded-full border transition${dim} ${sel
                ? 'bg-indigo-600 text-white border-indigo-600'
                : 'bg-indigo-50 text-indigo-700 border-indigo-100 hover:bg-indigo-100'}">
              #${esc(t.name)} <span class="${sel ? 'text-indigo-200' : 'text-slate-400'}">${t.count}</span>${
                t.open ? `<span class="${sel ? 'text-emerald-200' : 'text-emerald-600'} ml-0.5">${t.open}</span>` : ''}
            </button>`;
          }).join('')}</div>
        </details>`;
      }).join('');
    }

    function renderSelectedTags() {
      const wrap = document.getElementById('selected-tags');
      wrap.innerHTML = selectedTags.map(t =>
        `<span class="text-xs px-2 py-1 rounded-full bg-indigo-600 text-white flex items-center gap-1">
           #${esc(t)}<button onclick="toggleTag('${esc(t)}')" class="hover:text-indigo-200 font-bold">×</button></span>`
      ).join('');
      const modeWrap = document.getElementById('tag-mode-wrap');
      const clearBtn = document.getElementById('tag-clear');
      if (selectedTags.length >= 2) {
        modeWrap.classList.remove('hidden'); modeWrap.classList.add('flex');
        renderTagMode();
      } else {
        modeWrap.classList.add('hidden'); modeWrap.classList.remove('flex');
      }
      clearBtn.classList.toggle('hidden', selectedTags.length === 0);
    }

    function renderTagMode() {
      const or = document.getElementById('mode-or');
      const and = document.getElementById('mode-and');
      const on = 'bg-indigo-600 text-white border-indigo-600';
      const off = 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50';
      or.className = `px-2 py-1 rounded-l-lg border text-xs ${tagMode === 'or' ? on : off}`;
      and.className = `px-2 py-1 rounded-r-lg border -ml-px text-xs ${tagMode === 'and' ? on : off}`;
      or.textContent = 'いずれか含む(OR)';
      and.textContent = 'すべて含む(AND)';
    }

    function setTagMode(m) { tagMode = m; renderTagMode(); search(0); }

    function toggleTag(name) {
      const i = selectedTags.indexOf(name);
      if (i >= 0) selectedTags.splice(i, 1); else selectedTags.push(name);
      renderSelectedTags();
      if (TAG_DATA) renderTagPanel();
      search(0);
    }

    function clearTags() {
      selectedTags = [];
      renderSelectedTags();
      if (TAG_DATA) renderTagPanel();
      search(0);
    }

    // カード内タグクリック（旧APIとの互換名）
    function filterByTag(name) { toggleTag(name); }

    async function search(page = 0, scroll = false) {
      currentPage = page;
      const q = document.getElementById('q').value;
      const category = document.getElementById('category').value;
      const prefecture = document.getElementById('prefecture').value;
      const ministry = document.getElementById('ministry').value;
      const source = document.getElementById('source').value;
      const sort = document.getElementById('sort').value;
      const dlf = document.getElementById('deadline-from').value;
      const dlt = document.getElementById('deadline-to').value;
      const pbf = document.getElementById('published-from').value;
      const pbt = document.getElementById('published-to').value;

      const params = new URLSearchParams({ skip: page * PAGE_SIZE, limit: PAGE_SIZE });
      if (q) params.append('q', q);
      if (category) params.append('category', category);
      if (prefecture) params.append('prefecture', prefecture);
      if (ministry) params.append('organization', ministry);
      if (source) params.append('source', source);
      if (sort) params.append('sort', sort);
      if (currentDue) params.append('due_within', currentDue);
      if (dlf) params.append('deadline_from', dlf);
      if (dlt) params.append('deadline_to', dlt);
      if (pbf) params.append('published_from', pbf);
      if (pbt) params.append('published_to', pbt);
      if (selectedTags.length) {
        params.append('tags', selectedTags.join(','));
        params.append('tag_mode', tagMode);
      }
      if (currentStatus) params.append('status', currentStatus);

      // 検索条件をURLに反映（ブックマーク・共有・リロード復元用）
      const urlParams = new URLSearchParams();
      if (q) urlParams.set('q', q);
      if (category) urlParams.set('category', category);
      if (prefecture) urlParams.set('prefecture', prefecture);
      if (ministry) urlParams.set('ministry', ministry);
      if (source) urlParams.set('source', source);
      if (sort) urlParams.set('sort', sort);
      if (currentDue) urlParams.set('due', currentDue);
      if (dlf) urlParams.set('dlf', dlf);
      if (dlt) urlParams.set('dlt', dlt);
      if (pbf) urlParams.set('pbf', pbf);
      if (pbt) urlParams.set('pbt', pbt);
      if (selectedTags.length) {
        urlParams.set('tags', selectedTags.join(','));
        if (tagMode !== 'or') urlParams.set('tag_mode', tagMode);
      }
      if (currentStatus) urlParams.set('status', currentStatus);
      if (page > 0) urlParams.set('page', page + 1);
      const qs = urlParams.toString();
      history.replaceState(null, '', qs ? '?' + qs : location.pathname);

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').innerHTML = '';
      document.getElementById('no-results').classList.add('hidden');

      const res = await fetch('/api/tenders?' + params);
      const data = await res.json();

      document.getElementById('loading').classList.add('hidden');
      if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });

      if (data.items.length === 0) {
        document.getElementById('no-results').classList.remove('hidden');
        document.getElementById('result-summary').textContent = '';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      document.getElementById('result-summary').textContent =
        `${data.total.toLocaleString()}件中 ${page * PAGE_SIZE + 1}〜${Math.min((page + 1) * PAGE_SIZE, data.total)}件を表示`;

      document.getElementById('results').innerHTML = data.items.map(t => renderCard(t)).join('');
      renderPagination(data.total, page);

      // 詳細ページから戻ってきた場合、保存したスクロール位置へ復元（1回だけ）
      try {
        const saved = JSON.parse(sessionStorage.getItem('backScroll') || 'null');
        if (saved && saved.qs === location.search) {
          sessionStorage.removeItem('backScroll');
          window.scrollTo(0, saved.y);
        }
      } catch (e) {}
    }

    function renderCard(t) {
      const badgeClass = t.category === '入札' ? 'badge-nyusatsu'
        : t.category === 'RFI' ? 'badge-rfi'
        : t.category === '随意契約' ? 'badge-zuii'
        : 'badge-proposal';
      const ds = deadlineStatus(t.deadline);
      const srcColor = SOURCE_COLOR[t.source] || 'bg-slate-50 text-slate-500 border-slate-200';

      const awardeeHtml = t.awardee
        ? `<div class="mt-2 text-xs text-violet-700 font-medium">🏆 決定事業者: ${esc(t.awardee)}</div>` : '';
      const amountHtml = t.amount
        ? `<span class="text-xs text-slate-500 bg-slate-50 border border-slate-100 rounded px-1.5 py-0.5">💴 ${esc(t.amount)}</span>` : '';
      const tagsHtml = (t.tags && t.tags.length)
        ? `<div class="flex flex-wrap gap-1">${t.tags.map(tag =>
            `<span onclick="event.stopPropagation(); filterByTag('${esc(tag)}')"
                   class="cursor-pointer text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-100">#${esc(tag)}</span>`).join('')}</div>`
        : '';

      // AI要約（箇条書き形式と旧段落形式の両対応）
      // ホームのカードでは「事業内容」だけを表示する（詳細は各案件ページで）
      function renderSummary(summary) {
        if (!summary) return '';
        const isBullets = summary.startsWith('・') || summary.includes('\n・');
        let text = '';
        if (isBullets) {
          const lines = summary.split('\n').filter(l => l.trim());
          // 「・事業内容: ○○」の行を探して値部分を取り出す
          const jigyo = lines.find(l => /^・?\s*事業内容\s*[:：]/.test(l));
          if (jigyo) {
            text = jigyo.replace(/^・?\s*事業内容\s*[:：]\s*/, '').trim();
          } else {
            // 事業内容が無ければ先頭項目の値（ラベルがあれば除く）
            const first = lines[0].replace(/^・/, '').trim();
            text = first.replace(/^[^:：]{1,12}[:：]\s*/, '').trim();
          }
        } else {
          text = summary;
        }
        if (!text) return '';
        return `<div class="mt-3 summary-block rounded-lg px-3 py-2.5">
          <p class="text-xs text-indigo-400 font-medium mb-1 tracking-wide">✦ 事業内容</p>
          <p class="text-sm text-slate-700 leading-relaxed summary-text">${esc(text)}</p>
        </div>`;
      }
      const summaryHtml = renderSummary(t.summary);

      return `
        <div onclick="goDetail(${t.id})"
             class="bg-white border border-slate-200 rounded-2xl p-4 card-hover cursor-pointer">
          <div class="flex items-start gap-3">
            <div class="flex flex-col gap-1.5 mt-0.5 shrink-0">
              ${statusBadge(t.status)}
              <span class="text-center text-xs font-medium px-2 py-0.5 rounded-full ${badgeClass}">${esc(t.category)}</span>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-blue-700 font-semibold text-sm leading-snug">${esc(t.title.replace(/^【[^】]*】\s*/, ''))}</p>
              <div class="mt-2 flex flex-wrap gap-x-3 gap-y-1 items-center">
                <span class="text-xs text-slate-600 font-medium">🏢 ${esc(t.organization) || '—'}</span>
                ${t.published_at ? `<span class="text-xs text-slate-400">掲載: ${t.published_at}</span>` : ''}
                <span class="text-xs ${ds.cls}">${ds.label}${ds.badge}</span>
                ${t.result_date ? `<span class="text-xs text-violet-500">決定: ${esc(t.result_date)}</span>` : ''}
                ${amountHtml}
              </div>
              ${awardeeHtml}
              ${summaryHtml}
              ${tagsHtml ? `<div class="mt-2">${tagsHtml}</div>` : ''}
              <div class="mt-2 flex items-center justify-between">
                <span class="text-xs border ${srcColor} rounded px-1.5 py-0.5">${esc(srcLabel(t.source))}</span>
                <span class="text-xs text-slate-300">クリックで詳細 →</span>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderPagination(total, currentPage) {
      const totalPages = Math.ceil(total / PAGE_SIZE);
      if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

      let html = '';
      const start = Math.max(0, currentPage - 2);
      const end = Math.min(totalPages - 1, currentPage + 2);

      if (currentPage > 0)
        html += `<button onclick="search(${currentPage - 1}, true)" class="px-3 py-1.5 border border-slate-200 rounded-lg text-sm hover:bg-slate-50 transition">‹ 前</button>`;
      for (let i = start; i <= end; i++) {
        const active = i === currentPage
          ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
          : 'border-slate-200 hover:bg-slate-50';
        html += `<button onclick="search(${i}, true)" class="px-3 py-1.5 border rounded-lg text-sm transition ${active}">${i + 1}</button>`;
      }
      if (currentPage < totalPages - 1)
        html += `<button onclick="search(${currentPage + 1}, true)" class="px-3 py-1.5 border border-slate-200 rounded-lg text-sm hover:bg-slate-50 transition">次 ›</button>`;

      document.getElementById('pagination').innerHTML = html;
    }

    function reset() {
      document.getElementById('q').value = '';
      document.getElementById('category').value = '';
      document.getElementById('prefecture').value = '';
      document.getElementById('ministry').value = '';
      document.getElementById('source').value = '';
      document.getElementById('sort').value = '';
      ['deadline-from', 'deadline-to', 'published-from', 'published-to']
        .forEach(id => document.getElementById(id).value = '');
      selectedTags = [];
      tagMode = 'or';
      currentStatus = '';
      currentDue = 0;
      renderSelectedTags();
      if (TAG_DATA) renderTagPanel();
      loadStats();
      search();
    }

    (async function init() {
      // URLパラメータから検索条件を復元（共有・ブックマーク・リロード対応）
      const params = new URLSearchParams(location.search);
      const q = params.get('q');
      if (q) document.getElementById('q').value = q;
      const setSel = (id, v) => { if (v) document.getElementById(id).value = v; };
      setSel('category', params.get('category'));
      setSel('prefecture', params.get('prefecture'));
      setSel('source', params.get('source'));
      setSel('sort', params.get('sort'));
      pendingMinistry = params.get('ministry') || '';
      currentStatus = params.get('status') || '';
      currentDue = parseInt(params.get('due') || '0', 10) || 0;
      // 期間（詳細検索）の復元
      const dateMap = { 'deadline-from': 'dlf', 'deadline-to': 'dlt',
                        'published-from': 'pbf', 'published-to': 'pbt' };
      let hasDate = false;
      for (const [id, key] of Object.entries(dateMap)) {
        const v = params.get(key);
        if (v) { document.getElementById(id).value = v; hasDate = true; }
      }
      if (hasDate) toggleAdvPanel();  // 期間指定があればパネルを開いた状態に
      // タグ復元（tags=複数 / tag=単一・旧リンク互換）
      const tagsParam = params.get('tags') || params.get('tag') || '';
      selectedTags = tagsParam ? tagsParam.split(',').map(s => s.trim()).filter(Boolean) : [];
      tagMode = params.get('tag_mode') === 'and' ? 'and' : 'or';
      renderSelectedTags();
      const page = Math.max(0, (parseInt(params.get('page') || '1', 10) || 1) - 1);
      // 機関フィルタ復元時は選択肢が埋まるのを待ってから検索する
      if (pendingMinistry) { await loadStats(); } else { loadStats(); }
      search(page);
    })();
  </script>
